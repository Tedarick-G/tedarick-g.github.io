<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sipariş Yardım Hesaplama</title>

<style>
:root{
  --purple:#f2e5f0;
  --green:#d9ead3;
  --orange:#fce4d6;
  --note:#e2f0d9;
  --line:#202020;
  --thin:1px;
  --medium:2px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:24px;
  background:#fff;
  color:#111;
  font-family:"Aptos Narrow",Aptos,Arial,sans-serif;
  font-size:16px;
}

.sheet{
  width:520px;
  max-width:100%;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin:0;
}

col.c1{width:22.8%}
col.c2{width:19.4%}
col.c3{width:24%}
col.c4{width:18.1%}
col.c5{width:15.7%}

td{
  height:23px;
  padding:1px 6px;
  vertical-align:middle;
  overflow:hidden;
  white-space:nowrap;
  border:0;
}

/* Hücre duvarları */
.btM{border-top:var(--medium) solid var(--line)!important}
.brM{border-right:var(--medium) solid var(--line)!important}
.bbM{border-bottom:var(--medium) solid var(--line)!important}
.blM{border-left:var(--medium) solid var(--line)!important}

.btT{border-top:var(--thin) solid var(--line)!important}
.brT{border-right:var(--thin) solid var(--line)!important}
.bbT{border-bottom:var(--thin) solid var(--line)!important}
.blT{border-left:var(--thin) solid var(--line)!important}

.title{
  text-align:center;
  background:#fff;
  font-weight:400;
}

.label,
.head{
  background:var(--purple);
}

.label{
  text-align:right;
}

.head{
  text-align:center;
}

.input-cell{
  background:var(--green);
  padding:0;
}

.calc{
  background:var(--orange);
  text-align:center;
  font-variant-numeric:tabular-nums;
}

.money{
  text-align:right;
  padding-right:8px;
}

.rate{
  text-align:center;
}

.spacer{
  height:23px;
}

.note{
  background:var(--note);
  text-align:center;
  vertical-align:top;
}

input{
  width:100%;
  height:100%;
  min-height:22px;
  border:0;
  outline:0;
  background:transparent;
  padding:1px 6px;
  font:inherit;
  color:#111;
  text-align:right;
}

.add{
  width:100%;
  height:100%;
  min-height:22px;
  border:0;
  background:transparent;
  font:inherit;
  color:#111;
  text-align:right;
  padding:1px 6px;
  cursor:pointer;
}

.add:hover{
  text-decoration:underline;
}

/* HARF DÜZELTME ALANI */

.text-tool{
  width:100%;
  margin-top:23px;
  border:2px solid var(--line);
}

.text-tool-title{
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:2px solid var(--line);
  background:#fff;
}

.text-tool textarea{
  display:block;
  width:100%;
  height:150px;
  resize:vertical;
  border:0;
  border-bottom:2px solid var(--line);
  outline:0;
  padding:10px;
  font:inherit;
  line-height:1.4;
  background:#fff;
  color:#111;
}

.text-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.text-buttons button{
  height:34px;
  border:0;
  border-right:1px solid var(--line);
  background:var(--purple);
  font:inherit;
  cursor:pointer;
}

.text-buttons button:last-child{
  border-right:0;
}

.text-buttons button:hover{
  background:#ead8e7;
}

.text-buttons button.copied{
  background:var(--green);
}

@media(max-width:560px){

  body{
    padding:12px;
  }

  .sheet{
    width:100%;
  }

  td,
  input,
  .add,
  .text-buttons button,
  .text-tool textarea{
    font-size:14px;
  }

}
</style>
</head>

<body>

<div class="sheet">

  <!-- KOMİSYON HESAPLAMA -->

  <table id="commissionTable">

    <colgroup>
      <col class="c1">
      <col class="c2">
      <col class="c3">
      <col class="c4">
      <col class="c5">
    </colgroup>

    <tr>
      <td colspan="5" class="title blM btM brM">
        Komisyon Hesaplama
      </td>
    </tr>

    <tr>
      <td class="label blM btM bbM"></td>

      <td class="head blM brT btM bbM">
        Tutar
      </td>

      <td class="head blT brT btM bbM">
        Komisyon
      </td>

      <td colspan="2" class="head blT brM btM bbM">
        Komisyonlu Tutar
      </td>
    </tr>

    <tbody id="productRows">

      <tr class="product-row">

        <td class="label product-name blM brM btM bbT">
          Ürün 1
        </td>

        <td class="input-cell btM bbT">
          <input class="amount" inputmode="decimal">
        </td>

        <td class="calc commission money blT brT btM bbT">
          0,00
        </td>

        <td colspan="2" class="calc total money blT brM btM bbT">
          0,00
        </td>

      </tr>

      <tr class="product-row">

        <td class="label product-name blM brM btT bbT">
          Ürün 2
        </td>

        <td class="input-cell btT bbT">
          <input class="amount" inputmode="decimal">
        </td>

        <td class="calc commission money blT brT btT bbT">
          0,00
        </td>

        <td colspan="2" class="calc total money blT brM btT bbT">
          0,00
        </td>

      </tr>

      <tr class="product-row">

        <td class="label product-name blM brM btT bbT">
          Ürün 3
        </td>

        <td class="input-cell btT bbT">
          <input class="amount" inputmode="decimal">
        </td>

        <td class="calc commission money blT brT btT bbT">
          0,00
        </td>

        <td colspan="2" class="calc total money blT brM btT bbT">
          0,00
        </td>

      </tr>

    </tbody>

    <tr>

      <td class="label blM brM btT bbT">
        <button class="add" type="button" id="addProduct">
          Ürün Ekle
        </button>
      </td>

      <td class="input-cell btT bbT"></td>

      <td class="calc blT brT btT bbT"></td>

      <td colspan="2" class="calc blT brM btT bbT"></td>

    </tr>

    <tr>

      <td class="label blM brM btM bbM">
        Toplam :
      </td>

      <td class="calc money brT btM bbM" id="sumAmount">
        0,00
      </td>

      <td class="calc money blT brT btM bbM" id="sumCommission">
        0,00
      </td>

      <td colspan="2" class="calc money blT brM btM bbM" id="sumTotal">
        0,00
      </td>

    </tr>

    <tr>

      <td class="label blM brM btM bbM">
        Komisyon :
      </td>

      <td class="input-cell brM btM bbM">
        <input id="commissionInput" inputmode="decimal">
      </td>

      <td class="label blM brM btM bbM">
        Oran :
      </td>

      <td colspan="2" class="calc rate blM brM btM bbM" id="commissionRate">
        0
      </td>

    </tr>

  </table>

  <div class="spacer"></div>

  <!-- HAVALE HESAPLAMA -->

  <table>

    <colgroup>
      <col class="c1">
      <col class="c2">
      <col class="c3">
      <col class="c4">
      <col class="c5">
    </colgroup>

    <tr>
      <td colspan="5" class="title blM btM brM">
        Havale Hesaplama
      </td>
    </tr>

    <tr>

      <td class="label blM brM btM bbM">
        Normal Tutar
      </td>

      <td class="input-cell btM bbM">
        <input id="normalAmount" inputmode="decimal">
      </td>

      <td class="label blM brM btM bbM">
        İndirimli Tutar
      </td>

      <td class="input-cell btM bbM">
        <input id="discountAmount" inputmode="decimal">
      </td>

      <td class="calc money blT brM btM bbM" id="transferResult">
        0,00
      </td>

    </tr>

  </table>

  <div class="spacer"></div>

  <!-- BİLGİ -->

  <table>

    <colgroup>
      <col class="c1">
      <col class="c2">
      <col class="c3">
      <col class="c4">
      <col class="c5">
    </colgroup>

    <tr>
      <td colspan="5" class="note blM brM btM bbM">
        Sadece Yeşil Hücreler Doldurma Alanlarıdır
      </td>
    </tr>

  </table>

  <!-- HARF DÜZELTME -->

  <div class="text-tool">

    <div class="text-tool-title">
      Büyük / Küçük Harf Düzeltme
    </div>

    <textarea
      id="textFixArea"
      placeholder="Metni buraya yapıştırın..."
    ></textarea>

    <div class="text-buttons">

      <button type="button" data-mode="upper">
        TÜMÜ
      </button>

      <button type="button" data-mode="title">
        Baş Harf
      </button>

      <button type="button" data-mode="sentence">
        Baş harf
      </button>

      <button type="button" data-mode="lower">
        tümü
      </button>

    </div>

  </div>

</div>

<script>

/* SAYI İŞLEMLERİ */

const trNumber = new Intl.NumberFormat('tr-TR',{
  minimumFractionDigits:2,
  maximumFractionDigits:2
});

function parseNum(v){

  v = String(v ?? '')
    .trim()
    .replace(/\s/g,'');

  if(!v) return 0;

  if(v.includes(',') && v.includes('.')){
    v = v.replace(/\./g,'').replace(',','.');
  }
  else if(v.includes(',')){
    v = v.replace(',','.');
  }

  const n = Number(v);

  return Number.isFinite(n) ? n : 0;
}

function fmt(n){

  return trNumber.format(
    Number.isFinite(n) ? n : 0
  );

}

/* KOMİSYON */

function calculateCommission(){

  const rows = [
    ...document.querySelectorAll('.product-row')
  ];

  const amounts = rows.map(row =>
    parseNum(
      row.querySelector('.amount').value
    )
  );

  const totalAmount = amounts.reduce(
    (a,b) => a+b,
    0
  );

  const commissionTotal = parseNum(
    document.getElementById('commissionInput').value
  );

  const rate = totalAmount
    ? commissionTotal / totalAmount
    : 0;

  let sumCommission = 0;
  let sumTotal = 0;

  rows.forEach((row,i)=>{

    const commission = amounts[i] * rate;
    const total = amounts[i] + commission;

    sumCommission += commission;
    sumTotal += total;

    row.querySelector('.commission').textContent =
      fmt(commission);

    row.querySelector('.total').textContent =
      fmt(total);

  });

  document.getElementById('sumAmount').textContent =
    fmt(totalAmount);

  document.getElementById('sumCommission').textContent =
    fmt(sumCommission);

  document.getElementById('sumTotal').textContent =
    fmt(sumTotal);

  document.getElementById('commissionRate').textContent =
    rate
      ? String(
          Math.round(rate * 1000000) / 1000000
        ).replace('.',',')
      : '0';

}

/* HAVALE */

function calculateTransfer(){

  const normal = parseNum(
    document.getElementById('normalAmount').value
  );

  const discount = parseNum(
    document.getElementById('discountAmount').value
  );

  document.getElementById('transferResult').textContent =
    fmt(
      discount
        ? (normal * normal / discount)
        : 0
    );

}

/* ÜRÜN EKLE */

function bindInputs(){

  document
    .querySelectorAll('.amount')
    .forEach(input=>{

      input.oninput =
        calculateCommission;

    });

}

function makeProductRow(n){

  const row =
    document.createElement('tr');

  row.className =
    'product-row';

  row.innerHTML = `

    <td class="label product-name blM brM btT bbT">
      Ürün ${n}
    </td>

    <td class="input-cell btT bbT">
      <input class="amount" inputmode="decimal">
    </td>

    <td class="calc commission money blT brT btT bbT">
      0,00
    </td>

    <td colspan="2" class="calc total money blT brM btT bbT">
      0,00
    </td>

  `;

  return row;

}

bindInputs();

document
  .getElementById('commissionInput')
  .addEventListener(
    'input',
    calculateCommission
  );

document
  .getElementById('normalAmount')
  .addEventListener(
    'input',
    calculateTransfer
  );

document
  .getElementById('discountAmount')
  .addEventListener(
    'input',
    calculateTransfer
  );

document
  .getElementById('addProduct')
  .addEventListener(
    'click',
    ()=>{

      const body =
        document.getElementById('productRows');

      const n =
        body.querySelectorAll('.product-row').length + 1;

      const row =
        makeProductRow(n);

      body.appendChild(row);

      bindInputs();

      row
        .querySelector('input')
        .focus();

      calculateCommission();

    }
  );

/* HARF DÜZELTME */

const textFixArea =
  document.getElementById('textFixArea');

function trUpper(text){

  return text.toLocaleUpperCase('tr-TR');

}

function trLower(text){

  return text.toLocaleLowerCase('tr-TR');

}

function titleCase(text){

  const lower =
    trLower(text);

  return lower.replace(
    /(^|[\s\-\/("''])\p{L}/gu,
    match => trUpper(match)
  );

}

function sentenceCase(text){

  let result =
    trLower(text);

  result = result.replace(
    /(^\s*\p{L}|[.!?]\s*\p{L})/gu,
    match => trUpper(match)
  );

  return result;

}

async function copyText(text,button){

  let copied = false;

  try{

    await navigator.clipboard.writeText(text);
    copied = true;

  }
  catch(e){

    try{

      textFixArea.focus();
      textFixArea.select();

      copied =
        document.execCommand('copy');

      textFixArea.setSelectionRange(
        text.length,
        text.length
      );

    }
    catch(err){}

  }

  if(copied){

    const oldText =
      button.dataset.originalText ||
      button.textContent;

    button.dataset.originalText =
      oldText;

    button.textContent =
      'Kopyalandı';

    button.classList.add(
      'copied'
    );

    clearTimeout(
      button.copyTimer
    );

    button.copyTimer =
      setTimeout(()=>{

        button.textContent =
          oldText;

        button.classList.remove(
          'copied'
        );

      },1200);

  }

}

document
  .querySelectorAll(
    '.text-buttons button'
  )
  .forEach(button=>{

    button.dataset.originalText =
      button.textContent.trim();

    button.addEventListener(
      'click',
      async()=>{

        let text =
          textFixArea.value;

        switch(
          button.dataset.mode
        ){

          case 'upper':

            text =
              trUpper(text);

            break;

          case 'title':

            text =
              titleCase(text);

            break;

          case 'sentence':

            text =
              sentenceCase(text);

            break;

          case 'lower':

            text =
              trLower(text);

            break;

        }

        textFixArea.value =
          text;

        await copyText(
          text,
          button
        );

      }
    );

  });

calculateCommission();
calculateTransfer();

</script>

</body>
</html>
